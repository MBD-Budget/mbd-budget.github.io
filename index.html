  <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg" />

  <link rel="stylesheet" href="assets/css/styles.css?v=22" />
  <script>
    (function () {
      var V = '22';
      try {
        if (localStorage.getItem('_budgetv') !== V) {
          localStorage.setItem('_budgetv', V);
          if (location.search.indexOf('_budgetv=' + V) === -1) {
            var q = new URLSearchParams(location.search);
            q.set('_budgetv', V);
            location.replace(location.pathname + '?' + q.toString() + location.hash);
          }
        }
      } catch (e) {}
    })();
  </script>
  <script src="config.js"></script>
</head>
<body data-route="checklist" data-theme="dark">
  <div id="splash">
    <div class="splash-brand">
      <div class="splash-logo-wrap">
        <img src="assets/img/logo.svg" class="splash-logo-img" alt="MBD Budget" />
      </div>
    </div>
    <div class="splash-bar-track">
      <div class="splash-bar"></div>
    </div>
  </div>
  <div id="root"><main class="container"><p class="hint">Loading…</p></main></div>
  <script type="module" src="assets/js/app.js?v=22"></script>
</body>
